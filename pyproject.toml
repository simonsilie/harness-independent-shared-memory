[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "harness-independent-shared-memory"
version = "0.1.0"
description = "Read-only recall evaluation of Basic Memory as shared memory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "basic-memory==1.0.0+semantic.2",
    "configargparse>=1.7.5",
    "loguru>=0.7",
    "pydantic>=2",
]

[project.scripts]
memory-ops = "ops.__main__:main"
shared-memory-mcp = "approval_gate.launch:mcp_main"
shared-memory-approval-gate = "approval_gate.launch:gate_main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyrefly>=0.45",
    "pytest>=9.2.0",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
basic-memory = { url = "https://github.com/simonsilie/harness-independent-shared-memory/releases/download/basic-memory-semantic.2/basic_memory-1.0.0%2Bsemantic.2-py3-none-any.whl" }

[tool.uv.build-backend]
module-name = ["approval_gate", "ops"]
module-root = ""
source-exclude = ["/approval_gate/config.json", "/build/.verify-venv/**", "/build/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise real filesystem, process or service boundaries",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "evaluation/*/runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PTH"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [
    "**/runs/**",
    ".venv/**",
    ".python/**",
    ".uv-cache/**",
]

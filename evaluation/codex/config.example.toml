[mcp_servers.basic_memory]
command = "/absolute/path/to/harness-independent-shared-memory/evaluation/bm"
args = ["mcp", "--project", "main"]
enabled_tools = ["bm_search", "bm_read"]
required = true
startup_timeout_sec = 120
